services:
  kudoku-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 2567
      MATCH_TICK_RATE: ${MATCH_TICK_RATE:-20}
      PUBLIC_HTTP_URL: ${PUBLIC_HTTP_URL:-}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
    ports:
      - "${KUDOKU_SERVER_PORT:-2567}:2567"
